<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחשבון מט"ח — שערי ייחוס</title>
 <link rel="stylesheet" href="mystyle.css">
</head>
<body>

    <div class="container">
        <h1>מחשבון מט"ח לפי שער הייחוס האחרון</h1>

        <label for="amount">סכום להמרה:</label>
        <input type="number" id="amount" value="100" step="any">

        <label for="from">ממטבע:</label>
        <select id="from">
            <option value="USD" selected>$ דולר אמריקאי (USD)</option>
            <option value="ILS">₪ שקל חדש (ILS)</option>
            <option value="EUR">€ אירו (EUR)</option>
            <option value="GBP">£ לירה שטרלינג (GBP)</option>
            <option value="JPY">¥ ין יפני (JPY)</option>
            <option value="AUD">A$ דולר אוסטרלי (AUD)</option>
            <option value="CAD">C$ דולר קנדי (CAD)</option>
            <option value="CHF">Fr פרנק שוויצרי (CHF)</option>
            <option value="CNY">¥ יואן סיני (CNY)</option>
        </select>

        <label for="to">למטבע:</label>
        <select id="to">
            <option value="ILS" selected>₪ שקל חדש (ILS)</option>
            <option value="USD">$ דולר אמריקאי (USD)</option>
            <option value="EUR">€ אירו (EUR)</option>
            <option value="GBP">£ לירה שטרלינג (GBP)</option>
            <option value="JPY">¥ ין יפני (JPY)</option>
            <option value="AUD">A$ דולר אוסטרלי (AUD)</option>
            <option value="CAD">C$ דולר קנדי (CAD)</option>
            <option value="CHF">Fr פרנק שוויצרי (CHF)</option>
            <option value="CNY">¥ יואן סיני (CNY)</option>
        </select>

        <button type="button" onclick="convert()">בצע המרה לפי השער האחרון</button>

        <div id="result" role="status" aria-live="polite" aria-atomic="true" aria-busy="false"></div>
    </div>

    <script src= "script.js"> </script>

</body>
</html>
